packages:
  - apps/*
  - packages/*

# Parla is not on npm yet: install the tarballs vendored by `pnpm parla:update`.
overrides:
  '@parlajs/core': file:./vendor/parla/parlajs-core-0.0.0.tgz
  '@parlajs/react': file:./vendor/parla/parlajs-react-0.0.0.tgz
  '@parlajs/compiler': file:./vendor/parla/parlajs-compiler-0.0.0.tgz
  '@parlajs/format-icu': file:./vendor/parla/parlajs-format-icu-0.0.0.tgz
  '@parlajs/format-mf2': file:./vendor/parla/parlajs-format-mf2-0.0.0.tgz

# Deliberately stricter than pnpm's 1440 default (3 days vs 1)
minimumReleaseAge: 4320

# The cooling-off period buys nothing against our own packages.
minimumReleaseAgeExclude:
  - '@marcalexiei/oxfmt-config'
  - '@marcalexiei/oxlint-config'
